name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

# GITHUB_TOKEN permissions needed to publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time, do not cancel a running one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci -f

      - name: Build
        run: npm run build

      # GitHub Pages has no rewrite rules, so a deep link like /yield would 404.
      # Pages serves 404.html for any unknown path, which boots the SPA and lets
      # react-router take over.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
